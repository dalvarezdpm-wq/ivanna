<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IVANNA - Cada etapa cuenta</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E68F97">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#FEF6F1;--surf:#FFFFFF;--ink:#4A2F36;--mute:#7A5B63;--line:#F0DAD5;--acc:#B84F66;--on:#FFFFFF;--feed:#A85F38;--sleep:#4F78A8;--dia:#8A5A7A;--bad:#B3361F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1D21;--surf:#35262B;--ink:#F8E8E4;--mute:#CDAEB4;--line:#4A363C;--acc:#F0A0AB;--on:#3A1820;--feed:#EBA47C;--sleep:#9DB8DB;--dia:#D9A3C8;--bad:#FF9C8F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2A1D21;--surf:#35262B;--ink:#F8E8E4;--mute:#CDAEB4;--line:#4A363C;--acc:#F0A0AB;--on:#3A1820;--feed:#EBA47C;--sleep:#9DB8DB;--dia:#D9A3C8;--bad:#FF9C8F;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:110px}
h1,h2,.age{font-family:Quicksand,Figtree,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:12px}.brand h1{font-size:20px;letter-spacing:.06em;font-weight:700}.brand small{display:block;color:var(--mute);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:18px;margin:0;font-weight:600}
button{font:inherit;border:0;border-radius:14px;padding:11px 16px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.p{background:var(--acc);color:var(--on);font-weight:700}
.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.dng{color:var(--bad);border-color:var(--bad);width:100%;margin-top:14px}
.hero{padding:26px 4px 10px;display:flex;gap:16px;align-items:center}
.hero img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.nm{color:var(--mute);font-weight:500}
.age{font-size:clamp(40px,12vw,58px);font-weight:800;line-height:1;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tools select{flex:1;min-width:0}
.tools button{padding:8px 12px;min-height:38px;font-size:14px}
.grid{display:grid;gap:10px}
.card{background:var(--surf);border-radius:18px;padding:14px 16px;border-left:6px solid var(--c)}
.card small{color:var(--mute);display:block}
.card b{font-size:18px;display:block;margin:2px 0}
.stats{display:flex;gap:8px;margin:14px 0}
.stats div{flex:1;background:var(--surf);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font:800 22px Quicksand,sans-serif}
.stats span{font-size:13px;color:var(--mute)}
h2{font-size:17px;margin:18px 0 8px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px;flex:none}
.item div{flex:1;min-width:0}
.item small{color:var(--mute)}
.item button{padding:4px 10px;min-height:32px;font-size:13px;background:none;color:var(--mute)}
.empty{text-align:center;padding:50px 10px}
.empty p{color:var(--mute)}
.soon{color:var(--mute);font-size:14px;margin-top:18px}
.ch{background:var(--surf);border-radius:18px;padding:12px 14px;margin-top:10px}
.chh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chh small{color:var(--mute)}
.ch svg{width:100%;height:auto;display:block;margin-top:6px}
.ch text{fill:var(--mute);font-size:10px;text-anchor:middle}
.warn{background:var(--surf);border:2px solid var(--bad);border-radius:18px;padding:12px 14px}
.warn b{display:block}.warn a{color:var(--acc)}
ul.al{padding-left:20px;margin:6px 0}ul.al li{margin:6px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
#bar button{flex:1;max-width:180px;color:var(--on);font-weight:700;font-size:14px;padding:11px 4px;background:var(--c)}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.45)}
.pn{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.pn h2{margin-top:0}
label{display:block;font-size:14px;color:var(--mute);margin-top:10px}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;margin-top:4px}
.ck{display:flex;gap:8px;align-items:center}
.ck input{width:22px;min-height:22px;margin:0}
.err{color:var(--bad);margin-top:10px;font-weight:500}
#pv{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-top:8px}
[hidden]{display:none!important}
#rep{display:none}
@media print{html,body{background:#fff!important;color:#000!important;padding:0!important}#app,#bar,#sh,#sync{display:none!important}#rep{display:block;color:#000;font:12px/1.4 Figtree,sans-serif}#rep h1{font-size:20px}#rep h2{font-size:14px;margin:14px 0 4px}#rep table{width:100%;border-collapse:collapse}#rep td,#rep th{border:1px solid #888;padding:3px 5px;text-align:left}}
</style>
</head>
<body>
<div id="app"><p style="padding:30px;text-align:center;color:#7A5B63">Cargando…</p></div>
<div id="bar"></div>
<div id="sh"></div>
<div id="rep"></div>
<script>
const K='bebe-app-v1';
let S={babies:[],events:[],cur:null,app:'IVANNA',user:'',meds:[],vax:[],vxc:[],gr:[],rut:[]},PH='';

const store=()=>window.cloudSync&&window.cloudSync();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dtl=d=>{d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmt=t=>new Date(t).toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.round(ms/60000),h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`};
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);if(m<1)return 'justo ahora';if(m<60)return `hace ${m} min`;const h=Math.floor(m/60);return h<48?`hace ${h} h ${m%60} min`:`hace ${Math.floor(h/24)} días`};
const v=id=>($('#'+id)?.value||'').trim();
const cb=()=>S.babies.find(b=>b.id===S.cur);
const pl=(n,a,b)=>`${n} ${n==1?a:b}`;
function age(bd){const b=new Date(bd),n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return y<0?[0,0,0]:[y,m,d]}
const COL={feed:'var(--feed)',sleep:'var(--sleep)',diaper:'var(--dia)',sym:'var(--bad)',visit:'var(--acc)',dose:'var(--acc)',act:'var(--sleep)',tooth:'var(--feed)',mem:'var(--dia)',mil:'var(--acc)'};
const NAME={feed:'Alimentación',sleep:'Sueño',diaper:'Pañal',sym:'Síntomas',visit:'Consulta',dose:'Medicamento',act:'Actividad',tooth:'Diente',mem:'Recuerdo',mil:'Hito'};
function desc(e){const d=e.d;
 if(e.t==='feed'){if(d.k==='pecho')return `Pecho ${d.s.toLowerCase()}${d.end?', '+dur(d.end-e.ts):''}`;if(d.k==='formula')return `Fórmula, ${d.ml} ml${d.br?' ('+esc(d.br)+')':''}`;return `${esc(d.fd)}${d.nw?', alimento nuevo':''}, ${d.ac.toLowerCase()}`}
 if(e.t==='sleep')return `${d.k}, ${dur(d.end-e.ts)}${d.w?', '+pl(d.w,'despertar','despertares'):''}`;
 if(e.t==='sym')return [d.t?d.t+' °C':'',...d.s,d.ot].filter(Boolean).map(esc).join(', ');if(e.t==='visit')return esc(d.r)+(d.dx?', diagnóstico: '+esc(d.dx):'');if(e.t==='dose')return esc(d.n)+', dosis administrada';if(e.t==='act')return esc(d.k)+(d.min?', '+d.min+' min':'');if(e.t==='tooth')return 'Diente: '+esc(d.n)+(d.m?', molestias: '+esc(d.m):'');if(e.t==='mem')return esc(d.k)+(d.txt?': '+esc(d.txt):'');if(e.t==='mil')return 'Hito: '+esc(d.k);return d.k+(d.k!=='Orina'?`, ${d.c.toLowerCase()}`:'')}
function render(){
 const b=cb(),H=`<div class="top"><div class="brand"><img src="emblem.png" alt="" width="44" height="44"><div><h1>${esc(S.app)}</h1><small>Cada etapa cuenta.</small></div></div><button class="g" onclick="setS()">Ajustes</button></div>`;
 if(!b){$('#app').innerHTML=H+`<section class="empty"><h2>Agrega a tu bebé para empezar</h2><p>Con su perfil podrás registrar tomas, sueño y pañales. Los datos se guardan en este dispositivo.</p><button class="p" onclick="bab()">Agregar bebé</button></section>`;$('#bar').innerHTML='';return}
 const [y,m,d]=age(b.bd);let big,sm='';
 if(y){big=pl(y,'año','años');sm=`${pl(m,'mes','meses')} y ${pl(d,'día','días')}`}else if(m){big=pl(m,'mes','meses');sm=`y ${pl(d,'día','días')}`}else big=pl(d,'día','días');
 const ev=S.events.filter(e=>e.b===b.id).sort((a,c)=>c.ts-a.ts),L=t=>ev.find(e=>e.t===t),t0=new Date().setHours(0,0,0,0);
 const td=t=>ev.filter(e=>e.t===t&&e.ts>=t0),sl=td('sleep').reduce((s,e)=>s+e.d.end-e.ts,0);
 const lf=L('feed'),ls=L('sleep'),ld=L('diaper');
 const card=(t,e,main,sub)=>`<div class="card" style="--c:${COL[t]}"><small>${NAME[t]}</small>${e?`<b>${main}</b><small>${sub}</small>`:`<b>Sin registros</b><small>Usa el botón de abajo para el primero</small>`}</div>`;
 $('#app').innerHTML=H+`<section class="hero">${b.ph?`<img src="${b.ph}" alt="">`:''}<div><div class="nm">${esc(b.n)}</div><div class="age">${big}</div><div class="sub">${sm}</div></div></section>
 <div class="tools">${S.babies.length>1?`<select aria-label="Bebé" onchange="S.cur=this.value;store();render()">${S.babies.map(x=>`<option value="${x.id}"${x.id===b.id?' selected':''}>${esc(x.n)}</option>`).join('')}</select>`:''}<button class="g" onclick="bab('${b.id}')">Editar perfil</button><button class="g" onclick="bab()">Agregar otro bebé</button></div>
 <div class="grid">${card('feed',lf,lf?desc(lf):'',lf?ago(lf.d.end||lf.ts):'')}${card('sleep',ls,ls?dur(ls.d.end-ls.ts):'',ls?'Despertó '+ago(ls.d.end).replace('hace ','hace '):'')}${card('diaper',ld,ld?desc(ld):'',ld?ago(ld.ts):'')}</div>
 ${hs(b,ev)}<div class="stats"><div><b>${td('feed').length}</b><span>tomas hoy</span></div><div><b>${sl?dur(sl).replace(' min','m').replace(' h ','h '):'0m'}</b><span>de sueño hoy</span></div><div><b>${td('diaper').length}</b><span>pañales hoy</span></div></div>
 <div class="tools"><button class="g" onclick="vacs()">Vacunas</button><button class="g" onclick="gro()">Crecimiento</button><button class="g" onclick="repS()">Reporte</button><button class="g" onclick="hitos()">Hitos</button><button class="g" onclick="dientes()">Dientes</button><button class="g" onclick="acts()">Actividades</button><button class="g" onclick="album()">Álbum</button><button class="g" onclick="asis()">Asistente</button></div>${wk(ev)}<h2>Historial</h2>${ev.length?ev.slice(0,40).map(e=>`<div class="item" style="--c:${COL[e.t]}"><span class="dot"></span><div>${desc(e)}${e.d.img&&/^https:/.test(e.d.img)?` <a href="${esc(e.d.img)}" target="_blank" rel="noopener" style="color:var(--acc)">Ver foto</a>`:''}<br><small>${fmt(e.ts)}${e.by?', por '+esc(e.by):''}${e.mod?', editado':''}${e.d.o?'. '+esc(e.d.o):''}</small></div>${e.t==='dose'?'':`<button onclick="newE('${e.t}','${e.id}')" aria-label="Editar registro">Editar</button>`}<button onclick="delE('${e.id}')" aria-label="Eliminar registro">Eliminar</button></div>`).join(''):'<p class="soon">Aún no hay registros.</p>'}
 <p class="soon">Siguientes módulos: medicamentos, vacunas, citas, crecimiento y reportes.</p>`;
 $('#bar').innerHTML=['feed','sleep','diaper'].map(t=>`<button style="--c:${COL[t]}" onclick="newE('${t}')">${NAME[t]}</button>`).join('')+`<button style="--c:var(--bad)" onclick="hl()">Salud</button>`;
}
function sheet(title,body,fn,lbl='Guardar'){$('#sh').innerHTML=`<div class="bk" onclick="closeS()"></div><div class="pn" role="dialog" aria-label="${title}"><h2>${title}</h2>${body}<div class="err" id="er"></div><div class="row"><button class="g" onclick="closeS()">Cancelar</button><button class="p" onclick="SV()">${lbl}</button></div></div>`;window.SV=fn}
const closeS=()=>{$('#sh').innerHTML='';render()};
const err=m=>{$('#er').textContent=m;return false};
const opts=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${x}</option>`).join('');
function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PH=c.toDataURL('image/jpeg',.7);$('#pv').src=PH;$('#pv').hidden=false};im.src=r.result};r.readAsDataURL(f)}
function bab(id){
 const b=id?S.babies.find(x=>x.id===id):{};PH=b.ph||'';
 sheet(id?'Editar perfil':'Perfil del bebé',`
 <label>Nombre completo<input id="f_n" value="${esc(b.n)}"></label>
 <label>Fotografía<input type="file" id="f_ph" accept="image/*" onchange="pic(this)"></label><img id="pv" alt="" src="${PH}"${PH?'':' hidden'}>
 <label>Fecha y hora de nacimiento<input type="datetime-local" id="f_bd" value="${b.bd?dtl(b.bd):''}"></label>
 <label>Sexo<select id="f_sx">${opts(['Femenino','Masculino'],b.sx)}</select></label>
 <label>Semanas de gestación al nacer<input type="number" id="f_wk" min="20" max="45" inputmode="numeric" value="${esc(b.wk)}"></label>
 <label>Tipo de nacimiento<select id="f_bt">${opts(['Parto vaginal','Cesárea'],b.bt)}</select></label>
 <label>Peso al nacer (g)<input type="number" id="f_w" min="0" inputmode="numeric" value="${esc(b.w)}"></label>
 <label>Talla al nacer (cm)<input type="number" id="f_l" min="0" step="0.1" inputmode="decimal" value="${esc(b.l)}"></label>
 <label>Perímetro cefálico al nacer (cm)<input type="number" id="f_hc" min="0" step="0.1" inputmode="decimal" value="${esc(b.hc)}"></label>
 <label>Tipo de alimentación<select id="f_fd">${opts(['Lactancia materna','Fórmula','Mixta','Con alimentación complementaria'],b.fd)}</select></label>
 <label>Alergias conocidas<input id="f_al" value="${esc(b.al)}"></label>
 <label>Antecedentes relevantes<textarea id="f_hx" rows="2">${esc(b.hx)}</textarea></label>
 <label>Pediatra<input id="f_pn" value="${esc(b.pn)}"></label>
 <label>Teléfono o contacto del pediatra<input id="f_pp" value="${esc(b.pp)}"></label>
 ${id?`<button class="g dng" onclick="delB('${id}')">Eliminar bebé y todos sus registros</button>`:''}`,()=>{
  const n=v('f_n'),bd=v('f_bd');
  if(!n)return err('Escribe el nombre completo.');
  if(!bd)return err('Indica la fecha y hora de nacimiento.');
  if(new Date(bd)>new Date())return err('La fecha de nacimiento no puede ser futura.');
  for(const k of ['f_wk','f_w','f_l','f_hc'])if(v(k)&&+v(k)<0)return err('Los valores numéricos no pueden ser negativos.');
  const iso=new Date(bd).toISOString();
  if(S.babies.some(x=>x.id!==b.id&&x.n.toLowerCase()===n.toLowerCase()&&x.bd===iso))return err('Ya existe un bebé con ese nombre y fecha de nacimiento.');
  const o={id:b.id||uid(),n,bd:iso,sx:v('f_sx'),wk:v('f_wk'),bt:v('f_bt'),w:v('f_w'),l:v('f_l'),hc:v('f_hc'),fd:v('f_fd'),al:v('f_al'),hx:v('f_hx'),pn:v('f_pn'),pp:v('f_pp'),ph:PH};
  if(b.id)S.babies[S.babies.findIndex(x=>x.id===b.id)]=o;else S.babies.push(o);
  S.cur=o.id;store();closeS()})}
function delB(id){if(!confirm('Se eliminará el perfil y todos sus registros. Esta acción no se puede deshacer.'))return;S.babies=S.babies.filter(x=>x.id!==id);S.events=S.events.filter(e=>e.b!==id);S.meds=S.meds.filter(m=>m.b!==id);S.vax=S.vax.filter(x=>x.b!==id);S.gr=S.gr.filter(x=>x.b!==id);S.rut=(S.rut||[]).filter(r=>r.b!==id);S.cur=S.babies[0]?.id||null;store();closeS()}
function delE(id){if(!confirm('¿Eliminar este registro?'))return;S.events=S.events.filter(e=>e.id!==id);store();render()}
function fk(){document.querySelectorAll('[data-k]').forEach(d=>d.hidden=d.dataset.k!==v('f_k'))}
function newE(t,eid){const E=eid?S.events.find(x=>x.id===eid):null;
 const now=dtl(Date.now()),O='<label>Observaciones<input id="f_o"></label>';let body,fn;
 const add=(ts,d)=>{if(S.events.some(e=>e.id!==eid&&e.b===S.cur&&e.t===t&&Math.abs(e.ts-ts)<60000&&JSON.stringify(e.d)===JSON.stringify(d)))return err('Ya existe un registro igual a esa hora.');
  if(E)Object.assign(E,{ts,d,mod:Date.now()});else S.events.push({id:uid(),b:S.cur,t,ts,d,by:S.user});store();closeS()};
 if(t==='feed'){body=`<label>Tipo<select id="f_k" onchange="fk()"><option value="pecho">Pecho</option><option value="formula">Fórmula</option><option value="comp">Alimentación complementaria</option></select></label>
 <label>Inicio<input type="datetime-local" id="f_t" value="${now}"></label>
 <div data-k="pecho"><label>Fin<input type="datetime-local" id="f_e"></label><label>Pecho<select id="f_s">${opts(['Izquierdo','Derecho','Ambos'])}</select></label></div>
 <div data-k="formula" hidden><label>Cantidad (ml)<input type="number" id="f_ml" min="1" inputmode="numeric"></label><label>Marca y tipo de fórmula<input id="f_br"></label></div>
 <div data-k="comp" hidden><label>Alimento<input id="f_fd"></label><label>Cantidad aproximada<input id="f_q"></label><label>Ingredientes<input id="f_in"></label><label>Aceptación<select id="f_ac">${opts(['Le gustó','Regular','Lo rechazó'])}</select></label><label class="ck"><input type="checkbox" id="f_nw">Alimento nuevo</label><label>Posibles reacciones<input id="f_rx"></label></div>`+O;
  fn=()=>{const k=v('f_k'),ts=+new Date(v('f_t'));if(!ts)return err('Indica la hora de inicio.');let d={k,o:v('f_o')};
   if(k==='pecho'){d.s=v('f_s');const e=v('f_e');if(e){d.end=+new Date(e);if(d.end<=ts)return err('La hora de fin debe ser posterior al inicio.')}}
   else if(k==='formula'){d.ml=+v('f_ml');d.br=v('f_br');if(!(d.ml>0))return err('Indica la cantidad en ml.')}
   else{d.fd=v('f_fd');if(!d.fd)return err('Escribe qué alimento comió.');Object.assign(d,{q:v('f_q'),ing:v('f_in'),ac:v('f_ac'),nw:$('#f_nw').checked,rx:v('f_rx')})}
   return add(ts,d)}}
 if(t==='sleep'){body=`<label>Tipo<select id="f_k">${opts(['Siesta','Sueño nocturno'])}</select></label><label>Se durmió<input type="datetime-local" id="f_t" value="${dtl(Date.now()-3600000)}"></label><label>Despertó<input type="datetime-local" id="f_e" value="${now}"></label><label>Despertares durante la noche<input type="number" id="f_w" min="0" inputmode="numeric"></label>`+O;

function acts(){const b=cb(),t0=new Date().setHours(0,0,0,0),l=evs('act').filter(e=>e.ts>=t0).sort((a,c)=>c.ts-a.ts),R=(S.rut||[]).filter(r=>r.b===b.id).sort((a,c)=>a.h<c.h?-1:1);
 sheet('Actividades y rutinas',`<h2>Rutinas</h2>`+(R.length?R.map(r=>{const d=l.some(e=>e.d.k===r.k);return `<div class="item" style="--c:${d?'var(--dia)':'var(--sleep)'}"><span class="dot"></span><div><b>${esc(r.k)}</b>, ${r.h}<br><small>${d?'Hecha hoy':'Pendiente hoy'}</small></div><button onclick="actNow('${r.id}')">Hecha</button><button onclick="rutD('${r.id}')">Quitar</button></div>`}).join(''):'<p class="soon">Crea rutinas con hora, como el baño de la noche o la lectura.</p>')+`<div class="row"><button class="g" onclick="rutN()">Nueva rutina</button></div><h2>Hoy</h2>`+(l.length?l.map(e=>`<div class="item" style="--c:var(--sleep)"><span class="dot"></span><div>${desc(e)}<br><small>${fmt(e.ts)}</small></div></div>`).join(''):'<p class="soon">Aún no hay actividades hoy.</p>'),()=>newE('act'),'Registrar actividad')}
function actNow(id){const r=S.rut.find(x=>x.id===id);S.events.push({id:uid(),b:r.b,t:'act',ts:Date.now(),d:{k:r.k,min:0,o:''},by:S.user});store();acts()}
function rutD(id){if(!confirm('¿Quitar esta rutina?'))return;S.rut=S.rut.filter(r=>r.id!==id);store();acts()}
function rutN(){sheet('Nueva rutina',`<label>Actividad<select id="f_k">${opts(ACT)}</select></label><label>Hora diaria<input type="time" id="f_h" value="09:00"></label>`,()=>{const h=v('f_h'),k=v('f_k');if(!h)return err('Indica la hora.');if(S.rut.some(r=>r.b===S.cur&&r.k===k&&r.h===h))return err('Esa rutina ya existe.');S.rut.push({id:uid(),b:S.cur,k,h});store();acts()})}
function asis(){const b=cb(),ev=S.events.filter(e=>e.b===b.id),now=Date.now(),t0=new Date().setHours(0,0,0,0),D=864e5,L=[],td=t=>ev.filter(e=>e.t===t&&e.ts>=t0).length;
 L.push(`<b>Hoy</b>: ${td('feed')} tomas, ${td('diaper')} pañales y ${dur(ev.filter(e=>e.t==='sleep'&&e.ts>=t0).reduce((s,e)=>s+e.d.end-e.ts,0))} de sueño registrados.`);
 const f=ev.filter(e=>e.t==='feed'&&e.ts>=now-7*D).sort((a,c)=>a.ts-c.ts);
 if(f.length>2){let g=0;for(let i=1;i<f.length;i++)g+=f[i].ts-f[i-1].ts;L.push(`<b>Alimentación</b>: ${(f.length/7).toFixed(1)} tomas por día en la última semana, con unos ${dur(g/(f.length-1))} entre una y otra.`)}
 const sl=ev.filter(e=>e.t==='sleep'&&e.ts>=now-7*D);if(sl.length)L.push(`<b>Sueño</b>: promedio de ${dur(sl.reduce((s,e)=>s+e.d.end-e.ts,0)/7)} al día en los últimos 7 días.`);
 const fa=[],g=S.gr.filter(x=>x.b===b.id).sort((a,c)=>c.ts-a.ts)[0],at=vxl(b).filter(x=>x.s==='Atrasada'||x.s==='Pendiente').length;
 if(!ev.some(e=>e.t==='feed'&&e.ts>now-8*36e5))fa.push('no hay tomas registradas en las últimas 8 horas');
 if(!td('diaper')&&new Date().getHours()>=12)fa.push('no hay pañales registrados hoy');
 if(!g||now-g.ts>45*D)fa.push('hace más de 6 semanas que no registras una medición');
 if(at)fa.push(`hay ${at} vacuna(s) pendientes o atrasadas en el calendario`);
 L.push(fa.length?`<b>Por revisar</b>: ${fa.join('; ')}.`:'<b>Por revisar</b>: no encontré registros faltantes.');
 sheet('Asistente',`<p>${L.join('</p><p>')}</p><p class="soon">Resumen automático de lo que registraste. No diagnostica, no sustituye al pediatra y no sugiere dosis ni cambios de tratamiento. Para la consulta, usa el botón Reporte.</p>`,closeS,'Cerrar')}
function setS(){
 sheet('Ajustes',`<label>Nombre de la app<input id="f_an" value="${esc(S.app)}"></label><label>Tu nombre (se anota en cada registro)<input id="f_us" value="${esc(S.user)}"></label>
 <label>Copia de seguridad (copia este texto y guárdalo; pégalo aquí para restaurar)<textarea id="f_bk" rows="4">${esc(JSON.stringify(S))}</textarea></label>
 <div class="row"><button class="g" onclick="cp()">Copiar</button><button class="g" onclick="rs()">Restaurar</button></div><div class="row"><button class="g" onclick="invite()">Invitar a otro cuidador</button><button class="g" onclick="logout()">Cerrar sesión</button></div><div class="row"><button class="g" onclick="avisos()">Activar avisos</button></div>`,()=>{S.app=v('f_an')||'IVANNA';S.user=v('f_us');store();closeS()})}
function cp(){const t=$('#f_bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}$('#er').style.color='var(--acc)';$('#er').textContent='Copia lista.'}
function rs(){try{const o=JSON.parse(v('f_bk'));if(!Array.isArray(o.babies)||!Array.isArray(o.events))throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;S=Object.assign(S,o);store();closeS()}catch(e){err('El texto no es una copia de seguridad válida.')}}
setInterval(()=>{if(!$('#sh').innerHTML&&window.cloudReady)render()},60000);
</script>
<script type="module" src="./firebase-app.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))</script>
